<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
        <h1>My First JavaScript</h1>

    <button type="button" onclick="document.getElementById('demo').innerHTML = Date()">
    Click me to display Date and Time.</button>

    <input type="text" id="num1" placeholder="Enter first number"><br/>
    <input type="text" id="num2" placeholder="Enter second number"><br/>
    <button type="button" onclick="getResult()">CLick me to display the results.</button><br/>
    <p id="results"></p>
</body>
</html>
<script>
    function getResult()
    {
        var num1 = parseFloat(document.getElementById('num1').value);
        var num2 = parseFloat(document.getElementById('num2').value);
        var sum = num1 + num2;
        var difference = num1 - num2;
        var product = num1 * num2;
        var quotient = num1 / num2;
        var modulus = num1 % num2;
        document.getElementById('demo').innerHTML = "Sum: " + sum + "<br/>" +
        "Difference: " + difference + "<br/>" +
        "Product: " + product + "<br/>" +
        "Quotient: " + quotient + "<br/>" +
        "Modulus: " + modulus;

    }
</script>
